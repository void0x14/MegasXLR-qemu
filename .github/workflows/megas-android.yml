name: Megas actual Android boot experiment
on:
  push:
    branches: ['work/android-runtime-native-stream']
    paths: ['tests/megas/android_boot.py', '.github/workflows/megas-android.yml']
permissions:
  contents: read
  actions: read
jobs:
  android9:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install experiment tools
        run: |
          sudo apt-get update
          sudo apt-get install -y xorriso cpio ffmpeg libx264-164 libyuv0 libfdt1 qemu-system-data seabios
          if [ -e /dev/kvm ]; then sudo chmod a+rw /dev/kvm; fi
      - name: Download and verify the official Android-x86 9.0-r2 ISO
        run: |
          curl --fail --location --retry 3 --connect-timeout 20 --max-time 600 'https://downloads.sourceforge.net/project/android-x86/Release%209.0/android-x86_64-9.0-r2.iso' -o android.iso
          echo 'f7eb8fc56f29ad5432335dc054183acf086c539f3990f0b6e9ff58bd6df4604e  android.iso' | sha256sum --check
          echo '1cc85b5ed7c830ff71aecf8405c7281a9c995aa0  android.iso' | sha1sum --check
      - name: Wait for the native fork runtime build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          runtime_run=$(gh run list --workflow megas-qemu.yml --branch work/android-runtime-native-stream --limit 1 --json databaseId --jq '.[0].databaseId')
          gh run watch "$runtime_run" --exit-status
          gh run download "$runtime_run" --name megas-fork-native-video --dir fork-runtime
          chmod +x fork-runtime/qemu-system-x86_64
          fork-runtime/qemu-system-x86_64 --version
      - name: Boot actual Android under kernel CPU memory and thread limits
        shell: bash
        run: |
          set -euo pipefail
          scope="/sys/fs/cgroup/megas-android-${GITHUB_RUN_ID}"
          sudo mkdir "$scope"
          trap 'sudo rmdir "$scope"' EXIT
          printf '100000 100000\n' | sudo tee "$scope/cpu.max" >/dev/null
          printf '2415919104\n' | sudo tee "$scope/memory.max" >/dev/null
          printf '0\n' | sudo tee "$scope/memory.swap.max" >/dev/null
          printf '48\n' | sudo tee "$scope/pids.max" >/dev/null
          sudo chown "$(id -u):$(id -g)" "$scope/cgroup.procs"
          python3 tests/megas/android_boot.py --iso android.iso --qemu fork-runtime/qemu-system-x86_64 --cgroup "$scope" --output android-proof
      - name: Preserve Android boot and stream evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: megas-android9-experiment
          path: |
            android-proof/report.json
            android-proof/serial.log
            android-proof/qemu.log
            android-proof/android.ts
          if-no-files-found: warn
